    .bg::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 30%, rgba(4,3,1,0.7) 100%); }
    .page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; padding: 2.5rem 2rem 3rem; max-width: 1200px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 1.5rem; border-bottom: 0.5px solid var(--border); padding-bottom: 1.25rem; }
    .logo-eye { width: 28px; height: 28px; flex-shrink: 0; }
    header h1 { font-size: 17px; font-weight: 500; letter-spacing: 0.01em; color: var(--text); }
    header p { font-size: 13px; color: var(--text-muted); margin-left: auto; font-weight: 300; }
    .api-bar { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 1.25rem; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .api-bar label { font-size: 12px; color: var(--text-muted); white-space: nowrap; font-weight: 300; }
    .api-bar input { flex: 1; font-family: var(--font-mono); font-size: 12px; font-weight: 300; padding: 6px 10px; border: 0.5px solid var(--border); border-radius: 6px; background: var(--surface-input); color: var(--text); }
    .api-bar input:focus { outline: none; border-color: var(--border-amber); }
    .api-status { font-size: 11px; white-space: nowrap; }
    .api-status.ok { color: var(--success-text); }
    .api-status.err { color: #F09595; }
    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; flex: 1; }
    .panel { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; display: flex; flex-direction: column; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .panel-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--amber); margin-bottom: 12px; }
    textarea { flex: 1; width: 100%; min-height: 420px; font-family: var(--font-mono); font-size: 13px; font-weight: 300; line-height: 1.75; padding: 14px; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--surface-input); color: var(--text); resize: none; transition: border-color 0.2s, background 0.2s; }
    textarea:focus { outline: none; border-color: var(--border-amber); background: var(--surface-input-focus); }
    textarea::placeholder { color: var(--text-dim); font-weight: 300; }
    .controls { display: flex; gap: 8px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
    button { font-family: var(--font); font-size: 13px; font-weight: 400; padding: 8px 16px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--surface-input); color: var(--text); cursor: pointer; transition: background 0.15s, border-color 0.15s; white-space: nowrap; }
    button:hover { background: var(--surface-input-focus); border-color: rgba(255,255,255,0.2); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary { background: var(--amber-dim); color: var(--amber); border-color: var(--amber-border); font-weight: 500; }
    .btn-primary:hover { background: rgba(239,159,39,0.22); }
    .mic-btn { display: flex; align-items: center; gap: 7px; }
    .mic-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .mic-btn.recording { background: rgba(226,75,74,0.15); color: #F09595; border-color: rgba(226,75,74,0.35); }
    .mic-btn.recording .mic-dot { animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }
    .rec-timer { font-family: var(--font-mono); font-size: 12px; color: #F09595; display: none; }
    .rec-timer.visible { display: inline; }
    .status { font-size: 12px; color: var(--text-muted); margin-top: 10px; min-height: 18px; display: flex; align-items: center; gap: 6px; font-weight: 300; }
    .spinner { width: 12px; height: 12px; border: 1.5px solid rgba(255,255,255,0.15); border-top-color: var(--amber); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .output-panel { display: flex; flex-direction: column; }
    .output-scroll { flex: 1; overflow-y: auto; min-height: 420px; max-height: 70vh; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .output-scroll::-webkit-scrollbar { width: 4px; }
    .output-scroll::-webkit-scrollbar-track { background: transparent; }
    .output-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .output-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 380px; gap: 10px; }
    .output-empty-icon { width: 40px; height: 40px; border-radius: 50%; border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center; }
    .output-empty p { font-size: 13px; color: var(--text-dim); font-weight: 300; text-align: center; }
    .plan-text { font-family: var(--font-mono); font-size: 13px; font-weight: 300; line-height: 1.8; color: var(--text); white-space: pre-wrap; word-break: break-word; padding: 4px 2px; }
    .divider { border: none; border-top: 0.5px solid var(--border); margin: 16px 0; }
    .billing-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--success-text); margin-bottom: 10px; }
    .billing-text { font-family: var(--font-mono); font-size: 12.5px; font-weight: 300; line-height: 1.8; color: var(--text); white-space: pre-wrap; word-break: break-word; background: var(--success-bg); border: 0.5px solid var(--success-border); border-radius: var(--radius); padding: 12px 14px; }
    .output-actions { display: flex; justify-content: flex-end; margin-top: 14px; gap: 8px; }
    .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--surface-raised); border: 0.5px solid var(--border-amber); color: var(--amber); font-size: 13px; font-family: var(--font); padding: 10px 18px; border-radius: var(--radius); opacity: 0; transform: translateY(6px); transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 100; backdrop-filter: blur(12px); }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 700px) { .main-grid { grid-template-columns: 1fr; } header p { display: none; } }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="page">
    <header>
      <svg class="logo-eye" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="14" cy="14" rx="13" ry="13" stroke="rgba(239,159,39,0.5)" stroke-width="0.75"/>
        <path d="M4 14 C7 8, 21 8, 24 14 C21 20, 7 20, 4 14Z" stroke="#EF9F27" stroke-width="0.75" fill="rgba(239,159,39,0.08)"/>
        <circle cx="14" cy="14" r="4" stroke="#EF9F27" stroke-width="0.75" fill="rgba(239,159,39,0.15)"/>
        <circle cx="14" cy="14" r="1.5" fill="#EF9F27" opacity="0.8"/>
      </svg>
      <h1>Retina Plan Generator</h1>
      <p>williamfoulsham.com</p>
    </header>

    <div class="api-bar">
      <label>Anthropic API key</label>
      <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off" />
      <span class="api-status" id="apiStatus"></span>
      <button onclick="saveKey()" style="padding: 6px 12px; font-size: 12px;">Save</button>
    </div>

    <div id="cptPanel" style="display:none; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 1.25rem; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);">
      <div style="font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--amber); margin-bottom: 10px;">CPT reference</div>
      <div id="cptButtons" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
    </div>
    <div class="main-grid">
      <div class="panel">
        <div class="panel-label">Assessment</div>
        <textarea id="assessment" placeholder="64M&#10;&#10;# AMD&#10;- OD wet, recommend anti-VEGF&#10;- OS intermediate dry&#10;&#10;# Diabetes&#10;- diagnosed 2005&#10;- last A1c 7.3&#10;- OD mild NPDR no DME&#10;- OS mild NPDR no DME&#10;&#10;# PVD OU&#10;- no breaks on SDE"></textarea>
        <div class="controls">
          <button class="mic-btn" id="micBtn" onclick="toggleMic()">
            <span class="mic-dot"></span>
            <span id="micLabel">Record</span>
            <span class="rec-timer" id="timer">0:00</span>
          </button>
          <button class="btn-primary" id="generateBtn" onclick="generate()">Generate plan ↗</button>
          <button onclick="clearAll()">Clear</button>
        </div>
        <div class="status" id="status"></div>
      </div>

      <div class="panel output-panel">
        <div class="panel-label">Generated plan</div>
        <div class="output-scroll">
          <div class="output-empty" id="outputEmpty">
            <div class="output-empty-icon">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M2 9 C4.5 4, 13.5 4, 16 9 C13.5 14, 4.5 14, 2 9Z" stroke="rgba(245,240,232,0.25)" stroke-width="0.75"/>
                <circle cx="9" cy="9" r="2.5" stroke="rgba(245,240,232,0.25)" stroke-width="0.75"/>
              </svg>
            </div>
            <p>Your generated plan will appear here</p>
          </div>
          <div id="planOut" style="display:none;">
            <div class="plan-text" id="planText"></div>
            <hr class="divider">
            <div class="billing-label">CPT &amp; billing</div>
            <div class="billing-text" id="billingText"></div>
          </div>
        </div>
        <div class="output-actions" id="outputActions" style="display:none;">
          <button onclick="copyPlan()">Copy plan</button>
          <button onclick="copyAll()">Copy all</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SYSTEM_PROMPT = `You are a retina specialist clinical documentation assistant. Generate a minimal, consistently formatted clinical note from the specialist's assessment input.

OUTPUT FORMAT — follow exactly:

[AGE][M or F]

# Problem 1
- finding
- finding

# Problem 2
- finding
- finding

Plan:
- action
- action

Return in X weeks

GENERAL RULES:
- First line is always age + sex (e.g. "64M" or "78F")
- Each problem is a # header, findings as concise bullet points
- Keep everything minimal — match the brevity of the input
- Do not invent findings not present in the input
- Use standard abbreviations: OD, OS, OU, AMD, CNV, NPDR, DME, PDR, PVD, ERM, FTMH, CRVO, BRVO, CME, NV, SDE, PRN, PCP, LRP, PRP, PPV, MP, IOI, IOP, VA, CF, HM, LP, RD, VH, RBA, FP, OP, BP, BG

DIAGNOSIS-SPECIFIC NOTE FORMAT:

Retinal tear:
- discussed options of laser retinopexy vs observation
- recommend laser retinopexy. RBA reviewed including risk of progression to RD despite treatment, risk of laser injury, loss of vision. Patient expresses understanding and elects to proceed.

AMD — format EXACTLY as follows:
# AMD
- counseled on Amsler monitoring, importance of diet with green leafy vegetables, no smoking

OD [staging: early dry / intermediate dry / advanced dry / wet]
- recommend anti-VEGF  (only if wet or if specified)

OS [staging: early dry / intermediate dry / advanced dry / wet]
- recommend anti-VEGF  (only if wet or if specified)

Rules:
- The # AMD header covers the general condition and counselling bullet
- OD and OS each get their own line directly under the AMD block (no sub-header, just "OD ..." and "OS ..." as plain lines)
- Only add "- recommend anti-VEGF" under an eye if wet AMD or injection is specified for that eye
- If only one eye has AMD, still list both eyes if the other eye's status is known

T2DM — format EXACTLY as follows:
# T2DM
- diagnosed [year, use *** if not mentioned]
- last A1c [value, use *** if not mentioned]
- counseled on the importance of BP/BG control

OD [staging: mild NPDR / moderate NPDR / severe NPDR / PDR] [with or without DME]
- recommend anti-VEGF / PRP  (only if specified or clinically indicated)

OS [staging: mild NPDR / moderate NPDR / severe NPDR / PDR] [with or without DME]
- recommend anti-VEGF / PRP  (only if specified or clinically indicated)

Rules:
- The # T2DM header covers the general condition, year diagnosed, A1c, and counseling line
- OD and OS each get their own plain line directly under the T2DM block
- Only add a recommendation bullet under an eye if treatment is specified or clearly indicated
- If only one eye has diabetic changes, list both eyes if the other eye's status is known

Choroidal nevus:
- small, flat, no OP
- FP today for documentation

PVD:
- no breaks on SDE

ERM (if patient electing surgery):
- patient symptomatic with [symptom]
- VA [value]
- discussed options of observation vs PPV/MP. RBA of PPV reviewed with patient including risk that vision does not improve, endophthalmitis, VH, RD, glaucoma, loss of vision. Patient expressed understanding and elects to proceed.

ERM (if observing):
- patient symptomatic/asymptomatic with [symptom if any]
- VA [value]

FTMH (if patient electing surgery):
- patient symptomatic with [symptom]
- VA [value]
- reviewed imaging and diagnosis with patient
- discussed options of observation vs PPV/MP/gas. RBA of PPV reviewed with patient including risk that vision does not improve, endophthalmitis, VH, RD, glaucoma, loss of vision. Gas precautions reviewed with patient including no flying until gas resolved. Patient expressed understanding and elects to proceed.

CRVO/BRVO:
- symptoms started [date/timeframe]
- evidence/no evidence of CME
- evidence/no evidence of NV
- counseled patient on importance of BP/BG/lipid control with PCP

PLAN SECTION RULES — apply these automatically based on what is in the assessment:

1. If any intravitreal injection is recommended:
   - [DRUG NAME] OD/OS today  (use the drug name specified; default to Avastin if unspecified)
   - RBA reviewed including risk of endophthalmitis, VH, RD
   - worsening precautions reviewed

2. If any laser procedure is recommended (LRP or PRP):
   - LRP/PRP OD/OS today
   - RBA reviewed with patient including risk of progression despite treatment, risk of laser injury, risk of loss of vision

3. If there is any history of diabetes, hypertension, or a diagnosis of CRVO or BRVO:
   - BP/BG/lipid control with PCP
   If there is any history of diabetes also add:
   - Emphasized the critical importance of consistent follow-up and the risk of permanent loss of vision if lost to follow-up

4. For ALL notes, always include:
   - worsening precautions reviewed
   (do not duplicate this line if already added under rule 1 or 2)

5. End every note with "Return in X weeks" on its own line — choose a clinically appropriate interval:
   - 5 weeks: active CNV, recent injection, new retinal tear post-laser
   - 6-8 weeks: new CRVO/BRVO, recent PPV
   - 3-4 months: stable NPDR, stable ERM, stable AMD
   - 6-12 months: choroidal nevus, PVD, very stable findings

After the main note body (after "Return in X weeks"), add the E/M justification as follows:

E/M level: [99204 or 99205]
[2-3 sentence paragraph defending the E/M level based on MDM complexity. Reference the specific diagnoses, the number and complexity of problems addressed, the data reviewed (imaging, records), and the risk of management (e.g. prescription drug management, decision for surgery, intravitreal injection). Write this as if it were documentation in the medical record justifying the billing level. Use clinical language appropriate for a retina specialist.]

Then on a new line output exactly "---BILLING---" followed by:

CPT codes:
[code] — [description]

Billing note: [any flags or caveats]

Output ONLY the note, E/M justification, and billing section. No preamble, no explanation.`;

    let mediaRecorder = null, audioChunks = [], isRecording = false, timerInterval = null, seconds = 0;

    window.addEventListener('load', () => {
      const saved = localStorage.getItem('retina_api_key');
      if (saved) { document.getElementById('apiKey').value = saved; setApiStatus(true); }
    });

    function saveKey() {
      const key = document.getElementById('apiKey').value.trim();
      if (!key.startsWith('sk-ant-')) { setApiStatus(false, 'Invalid key format'); return; }
      localStorage.setItem('retina_api_key', key);
      setApiStatus(true);
      showToast('API key saved');
    }

    function setApiStatus(ok, msg) {
      const el = document.getElementById('apiStatus');
      if (ok) { el.textContent = 'Key saved'; el.className = 'api-status ok'; }
      else { el.textContent = msg || 'No key'; el.className = 'api-status err'; }
    }

    function getKey() { return localStorage.getItem('retina_api_key') || document.getElementById('apiKey').value.trim(); }

    async function toggleMic() {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            setStatus(true, 'Transcribing...');
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = async () => {
              const b64 = reader.result.split(',')[1];
              const key = getKey();
              if (!key) { setStatus(false, 'Add your API key above first.'); return; }
              try {
                const res = await fetch('https://api.anthropic.com/v1/messages', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
                  body: JSON.stringify({ model: 'claude-sonnet-4-5', max_tokens: 500, messages: [{ role: 'user', content: [
                    { type: 'text', text: 'Transcribe this retina specialist clinical dictation verbatim. Return only the transcription, no preamble.' },
                    { type: 'image', source: { type: 'base64', media_type: 'audio/webm', data: b64 } }
                  ]}]})
                });
                const data = await res.json();
                const t = (data.content||[]).map(x=>x.text||'').join('');
                const cur = document.getElementById('assessment').value;
                document.getElementById('assessment').value = cur ? cur + '\n' + t : t;
                setStatus(false, 'Transcription added.');
              } catch(e) { setStatus(false, 'Transcription failed — please type your assessment.'); }
            };
            reader.readAsDataURL(blob);
          };
          mediaRecorder.start();
          isRecording = true; seconds = 0;
          document.getElementById('micBtn').classList.add('recording');
          document.getElementById('micLabel').textContent = 'Stop';
          document.getElementById('timer').classList.add('visible');
          timerInterval = setInterval(() => {
            seconds++;
            const m = Math.floor(seconds/60), s = seconds%60;
            document.getElementById('timer').textContent = m+':'+(s<10?'0':'')+s;
          }, 1000);
        } catch(e) { setStatus(false, 'Microphone access denied.'); }
      } else {
        clearInterval(timerInterval);
        mediaRecorder.stop();
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
        document.getElementById('micLabel').textContent = 'Record';
        document.getElementById('timer').classList.remove('visible');
        setStatus(false, '');
      }
    }

    async function generate() {
      const assessment = document.getElementById('assessment').value.trim();
      if (!assessment) { setStatus(false, 'Please enter an assessment first.'); return; }
      const key = getKey();
      if (!key) { setStatus(false, 'Please enter your Anthropic API key above.'); return; }
      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      setStatus(true, 'Generating plan...');
      document.getElementById('outputEmpty').style.display = 'none';
      document.getElementById('planOut').style.display = 'none';
      document.getElementById('outputActions').style.display = 'none';
      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
          body: JSON.stringify({ model: 'claude-sonnet-4-5', max_tokens: 1500, system: SYSTEM_PROMPT, messages: [{ role: 'user', content: assessment }] })
        });
        const data = await res.json();
        if (data.error) { setStatus(false, 'API error: ' + data.error.message); btn.disabled = false; return; }
        const full = (data.content||[]).map(b=>b.text||'').join('');
        const parts = full.split('---BILLING---');
        document.getElementById('planText').textContent = parts[0].trim();
        document.getElementById('billingText').textContent = parts[1] ? parts[1].trim() : '';
        document.getElementById('planOut').style.display = 'block';
        document.getElementById('outputActions').style.display = 'flex';
        renderCPT(parts[0]);
        setStatus(false, '');
      } catch(e) { setStatus(false, 'Request failed — check your API key and connection.'); }
      btn.disabled = false;
    }

    function clearAll() {
      document.getElementById('assessment').value = '';
      document.getElementById('planOut').style.display = 'none';
      document.getElementById('outputEmpty').style.display = 'flex';
      document.getElementById('outputActions').style.display = 'none';
      document.getElementById('cptPanel').style.display = 'none';
      setStatus(false, '');
    }

    function copyPlan() {
      navigator.clipboard.writeText(document.getElementById('planText').textContent).then(() => showToast('Plan copied'));
    }

    function copyAll() {
      const plan = document.getElementById('planText').textContent;
      const billing = document.getElementById('billingText').textContent;
      navigator.clipboard.writeText(plan + '\n\n---\n' + billing).then(() => showToast('Copied to clipboard'));
    }


    const CPT_MAP = [
      { keys: ['amd', 'drusen', 'dry amd', 'wet amd', 'cnv', 'choroidal neovascularization'], codes: [
        { code: 'H35.31', desc: 'Nonexudative AMD' },
        { code: 'H35.32', desc: 'Exudative AMD' },
        { code: '67028', desc: 'Intravitreal injection' },
        { code: '92134', desc: 'OCT posterior segment' },
      ]},
      { keys: ['diabetes', 'npdr', 'pdr', 'dme', 'diabetic'], codes: [
        { code: 'E11.319', desc: 'T2DM with NPDR' },
        { code: 'E11.359', desc: 'T2DM with PDR' },
        { code: 'E11.311', desc: 'T2DM with DME' },
        { code: '67028', desc: 'Intravitreal injection' },
        { code: '67228', desc: 'PRP laser' },
        { code: '92134', desc: 'OCT posterior segment' },
      ]},
      { keys: ['retinal tear', 'tear', 'retinopexy', 'lrp'], codes: [
        { code: 'H33.311', desc: 'Retinal tear OD' },
        { code: 'H33.312', desc: 'Retinal tear OS' },
        { code: '67105', desc: 'Laser retinopexy' },
      ]},
      { keys: ['crvo', 'central retinal vein'], codes: [
        { code: 'H34.811', desc: 'CRVO OD' },
        { code: 'H34.812', desc: 'CRVO OS' },
        { code: '67028', desc: 'Intravitreal injection' },
        { code: '92134', desc: 'OCT posterior segment' },
      ]},
      { keys: ['brvo', 'branch retinal vein'], codes: [
        { code: 'H34.831', desc: 'BRVO OD' },
        { code: 'H34.832', desc: 'BRVO OS' },
        { code: '67028', desc: 'Intravitreal injection' },
        { code: '92134', desc: 'OCT posterior segment' },
      ]},
      { keys: ['erm', 'epiretinal', 'macular pucker'], codes: [
        { code: 'H35.371', desc: 'ERM OD' },
        { code: 'H35.372', desc: 'ERM OS' },
        { code: '67041', desc: 'PPV with membrane peel' },
        { code: '92134', desc: 'OCT posterior segment' },
      ]},
      { keys: ['ftmh', 'full thickness macular hole', 'macular hole'], codes: [
        { code: 'H35.341', desc: 'Macular hole OD' },
        { code: 'H35.342', desc: 'Macular hole OS' },
        { code: '67041', desc: 'PPV with membrane peel' },
        { code: '92134', desc: 'OCT posterior segment' },
      ]},
      { keys: ['pvd', 'posterior vitreous detachment'], codes: [
        { code: 'H43.811', desc: 'PVD OD' },
        { code: 'H43.812', desc: 'PVD OS' },
        { code: 'H43.813', desc: 'PVD OU' },
      ]},
      { keys: ['choroidal nevus', 'nevus'], codes: [
        { code: 'D31.41', desc: 'Choroidal nevus OD' },
        { code: 'D31.42', desc: 'Choroidal nevus OS' },
        { code: '92250', desc: 'Fundus photography' },
      ]},
    ];

    function renderCPT(planText) {
      const lower = planText.toLowerCase();
      const matched = new Map();

      CPT_MAP.forEach(entry => {
        if (entry.keys.some(k => lower.includes(k))) {
          entry.codes.forEach(c => matched.set(c.code, c.desc));
        }
      });

      const panel = document.getElementById('cptPanel');
      const container = document.getElementById('cptButtons');
      container.innerHTML = '';

      if (matched.size === 0) { panel.style.display = 'none'; return; }

      matched.forEach((desc, code) => {
        const btn = document.createElement('div');
        btn.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--surface-input);cursor:default;';
        btn.innerHTML = '<span style="font-family:var(--font-mono);font-size:12px;color:var(--amber);font-weight:500;">' + code + '</span><span style="font-size:12px;color:var(--text-muted);font-weight:300;">' + desc + '</span>';
        container.appendChild(btn);
      });

      panel.style.display = 'block';
    }

    function setStatus(loading, msg) {
      document.getElementById('status').innerHTML = loading ? '<div class="spinner"></div>' + msg : msg;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
